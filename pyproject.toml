[project]
name = "kubeagent"
version = "0.1.0"
description = "LlamaIndex-based autonomous Kubernetes troubleshooting agent"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "llama-index-core>=0.14.13",
    "llama-index-llms-openai-like>=0.5.3",
    "llama-index-utils-workflow>=0.11.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "coverage>=7.6",
    "httpx>=0.27",
    "ipython>=8.0",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "examples"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = "tests"
asyncio_mode = "auto"
addopts = "-vv --cov=app --cov-report=term-missing:skip-covered --cov-report=html --cov-report=term"

[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = ["tests/*", "scripts/*", "examples/*"]
exclude_lines = [
    "pragma: no cover",
    "def __str__",
    "def __repr__",
    "raise NotImplementedError",
]
