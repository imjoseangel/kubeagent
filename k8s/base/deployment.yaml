apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeagent
  namespace: kubeagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeagent
  template:
    metadata:
      labels:
        app: kubeagent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: kubeagent-readonly
      automountServiceAccountToken: true
      containers:
        - name: kubeagent
          image: kubeagent:latest
          ports:
            - name: http
              containerPort: 8000
            - name: health
              containerPort: 8001
          envFrom:
            - secretRef:
                name: kubeagent-litellm
            - configMapRef:
                name: kubeagent-config
          env:
            # OpenTelemetry distributed tracing. DISABLED by default: an empty
            # endpoint makes app/core/telemetry.py a no-op. To enable, point
            # this at an OTLP/HTTP collector (the exporter appends /v1/traces)
            # — use the same collector as the upstream model service so their
            # spans join, e.g.
            #   value: "http://otel-collector.observability.svc:4318"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: ""
            - name: OTEL_SERVICE_NAME
              value: "kubeagent"
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
