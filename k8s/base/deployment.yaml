apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeagent
  namespace: kubeagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeagent
  template:
    metadata:
      labels:
        app: kubeagent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: kubeagent-readonly
      automountServiceAccountToken: true
      containers:
        - name: kubeagent
          image: kubeagent:latest
          ports:
            - name: http
              containerPort: 8000
            - name: health
              containerPort: 8001
          envFrom:
            - secretRef:
                name: kubeagent-litellm
            - configMapRef:
                name: kubeagent-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
