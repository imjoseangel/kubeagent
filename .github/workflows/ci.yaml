name: CI

on:
  push:
    branches: [devel, main]
  pull_request:
    branches: [devel, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app examples

      - name: Test
        run: uv run pytest -q
