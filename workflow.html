        <script type="text/javascript">

              // initialize global variables.

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#ADD8E6", "id": "aggregate_tool_results", "label": "aggregate_tool_results", "shape": "box", "title": null}, {"color": "#90EE90", "id": "ToolCallResult", "label": "ToolCallResult", "shape": "ellipse", "title": null}, {"color": "#90EE90", "id": "AgentInput", "label": "AgentInput", "shape": "ellipse", "title": null}, {"color": "#FFA07A", "id": "StopEvent", "label": "StopEvent", "shape": "ellipse", "title": null}, {"color": "#ADD8E6", "id": "call_tool", "label": "call_tool", "shape": "box", "title": null}, {"color": "#90EE90", "id": "ToolCall", "label": "ToolCall", "shape": "ellipse", "title": null}, {"color": "#ADD8E6", "id": "init_run", "label": "init_run", "shape": "box", "title": null}, {"color": "#E27AFF", "id": "AgentWorkflowStartEvent", "label": "AgentWorkflowStartEvent", "shape": "ellipse", "title": null}, {"color": "#ADD8E6", "id": "parse_agent_output", "label": "parse_agent_output", "shape": "box", "title": null}, {"color": "#90EE90", "id": "AgentOutput", "label": "AgentOutput", "shape": "ellipse", "title": null}, {"color": "#ADD8E6", "id": "run_agent_step", "label": "run_agent_step", "shape": "box", "title": null}, {"color": "#90EE90", "id": "AgentSetup", "label": "AgentSetup", "shape": "ellipse", "title": null}, {"color": "#ADD8E6", "id": "setup_agent", "label": "setup_agent", "shape": "box", "title": null}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "aggregate_tool_results", "to": "AgentInput"}, {"arrows": "to", "from": "aggregate_tool_results", "to": "StopEvent"}, {"arrows": "to", "from": "ToolCallResult", "to": "aggregate_tool_results"}, {"arrows": "to", "from": "call_tool", "to": "ToolCallResult"}, {"arrows": "to", "from": "ToolCall", "to": "call_tool"}, {"arrows": "to", "from": "init_run", "to": "AgentInput"}, {"arrows": "to", "from": "AgentWorkflowStartEvent", "to": "init_run"}, {"arrows": "to", "from": "parse_agent_output", "to": "StopEvent"}, {"arrows": "to", "from": "parse_agent_output", "to": "AgentInput"}, {"arrows": "to", "from": "parse_agent_output", "to": "ToolCall"}, {"arrows": "to", "from": "AgentOutput", "to": "parse_agent_output"}, {"arrows": "to", "from": "run_agent_step", "to": "AgentOutput"}, {"arrows": "to", "from": "AgentSetup", "to": "run_agent_step"}, {"arrows": "to", "from": "setup_agent", "to": "AgentSetup"}, {"arrows": "to", "from": "AgentInput", "to": "setup_agent"}]);

                  nodeColors = {};

                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {

        }
    },
    "interaction": {

        "hideNodesOnDrag": false
    },
    "physics": {

        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
